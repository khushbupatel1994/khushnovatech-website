name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Pages URL
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$GITHUB_REPOSITORY" = "$GITHUB_REPOSITORY_OWNER/$GITHUB_REPOSITORY_OWNER.github.io" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$GITHUB_REPOSITORY_OWNER.github.io" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$repo_name" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$GITHUB_REPOSITORY_OWNER.github.io/$repo_name" >> "$GITHUB_ENV"
          fi

      - name: Build static website
        env:
          NEXT_PUBLIC_W3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_W3FORMS_ACCESS_KEY }}
        run: |
          pnpm --dir apps/web build
          touch apps/web/out/.nojekyll
          echo "khushnovatech.in" > apps/web/out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
